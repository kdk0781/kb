<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="style.css" media="all" />
    <title>KB 시세표 시세 안내</title>
</head>
<body>

<div class="container">
    <header>
        <div class="title-group">
            <h1>🔗 KB 시세표 시세표</h1>
            <button type="button" id="themeToggleBtn" class="theme-toggle-btn" aria-label="밤낮 모드 전환" title="밤낮 모드 전환">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
        <div class="update-time" id="updateTime">기준일: 2026.11.24 업데이트</div>
    </header>

    <div class="controls">
        <div class="category-tabs" id="categoryTabs">
            <button class="tab-btn active" data-filter="ALL">전체 보기</button>
            <button class="tab-btn" data-filter="YES">다운로드 가능</button>
            <button class="tab-btn" data-filter="NO">다운로드 불가</button>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="항목명 또는 기간 검색...">
    </div>

    <div class="list-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 28%;">항목명</th>
                    <th style="width: 34%;">링크 주소</th>
                    <th style="width: 22%;">기간</th>
                    <th style="width: 16%; text-align: center;">다운로드 유무</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <footer>
        * 안내된 링크 및 기간은 임시 운영 기준이며 사정에 따라 변경될 수 있습니다.
    </footer>
</div>
<script src="common.js"></script>

</body>
</html>
